# Baut den Shop und veröffentlicht ihn auf GitHub Pages:
# https://richard-bit-ui.github.io/tt-shop-frontend/
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (Unterordner /tt-shop-frontend/, Vorschau-Hinweis, für Suchmaschinen gesperrt)
        run: npm run build
        env:
          GH_PAGES_BASE: /tt-shop-frontend/
          VITE_PUBLIC_PREVIEW: '1'
      # Direktaufrufe von Unterseiten (z. B. /p/…) sollen die App laden statt einer 404-Seite
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
